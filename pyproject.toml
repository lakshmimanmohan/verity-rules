[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verity-rules"
version = "0.1.2"
description = "Learn entity-matching rules (column weights and comparison methods) from any CSV."
requires-python = ">=3.10"
readme = "README.md"
authors = [{ name = "lmanmohan" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.3.3",
    "numpy>=2.3.2; python_version >= '3.11'",
    "numpy>=1.24; python_version < '3.11'",
]

[project.optional-dependencies]
debug = ["scikit-learn>=1.1"]

[project.scripts]
verity = "verity_rules.cli:main"

[tool.setuptools]
packages = ["verity_rules"]
