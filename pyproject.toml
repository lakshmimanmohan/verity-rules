[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verity-rules"
version = "0.1.0"
description = "Learn entity-matching rules (column weights and comparison methods) from any CSV."
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "scikit-learn"]

[project.scripts]
verity = "verity_rules.cli:main"

[tool.setuptools]
packages = ["verity_rules"]
